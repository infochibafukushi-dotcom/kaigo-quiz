name = "kaigo-quiz-api"
main = "worker.js"
compatibility_date = "2026-05-16"

[[d1_databases]]
binding = "DB"
database_name = "kaigo-quiz"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[r2_buckets]]
binding = "QUIZ_IMAGES"
bucket_name = "kaigo-quiz-images"

[vars]
R2_PUBLIC_BASE_URL = "https://REPLACE_WITH_PUBLIC_R2_DOMAIN"
